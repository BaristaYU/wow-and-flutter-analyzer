name: Build (Windows / MFC)

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (Release and Debug | Win32)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -version '[17.0,18.0)' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $installation) {
            throw 'Visual Studio 2022 with the C++ tools was not found.'
          }
          & "$installation\Common7\Tools\Launch-VsDevShell.ps1" -Arch x86 -HostArch amd64 -SkipAutomaticLocation
          if (-not (Test-Path "${env:VCToolsInstallDir}atlmfc\include\afxwin.h")) {
            throw 'Install C++ MFC for the selected v143 build tools.'
          }
          $msbuild = Join-Path $installation 'MSBuild\Current\Bin\MSBuild.exe'
          foreach ($configuration in @('Release', 'Debug')) {
            & $msbuild wfgui.vcxproj /t:Rebuild /p:Configuration=$configuration /p:Platform=Win32 /m
            if ($LASTEXITCODE -ne 0) {
              throw "$configuration build failed with exit code $LASTEXITCODE"
            }
          }
          & .\tests\run-tests.ps1

      - name: Set version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $ver = $env:GITHUB_REF -replace 'refs/tags/', ''
          } else {
            $ver = $env:GITHUB_SHA.Substring(0, 7)
          }
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Rename binary with version
        shell: pwsh
        run: |
          $exe = Get-Item -LiteralPath Release/wfgui.exe
          $newName = "$($exe.BaseName)-${{ steps.version.outputs.version }}$($exe.Extension)"
          Rename-Item -LiteralPath $exe.FullName -NewName $newName
          Write-Host "Renamed to $newName"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wfgui-release-win32
          path: Release/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Release/*.exe
